name: Test, Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Runs for pull requests and pushes. Read-only: no write access, no OIDC token.
  test_build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up toolchain"
        uses: ./.github/actions/setup-toolchain

      - name: "Build & Test"
        run: |
          echo "Using yarn $(yarn --version) from $(command -v yarn)"
          yarn --frozen-lockfile && yarn dist && yarn test

  # Only runs for pushes to master, after all tests passed. The "release" environment
  # is restricted to master and required by the npm Trusted Publisher config, so no
  # other branch or pull request can obtain publishing rights.
  release:
    name: Release
    needs: [test_build, run-ios-spm-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push version commit and tag
      id-token: write # npm Trusted Publishing (OIDC)

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # credentials are kept: `yarn version` pushes the release commit and tag

      - name: "Set up toolchain"
        uses: ./.github/actions/setup-toolchain

      # Use the npm bundled with Node instead of downloading another version.
      - name: "Verify npm version (Trusted Publishers requires npm >= 11.5.1)"
        run: |
          node -e '
            const v = require("node:child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number), [x, y, z] = [11, 5, 1];
            console.log(`npm ${v}`);
            if (a < x || (a === x && (b < y || (b === y && c < z)))) {
              console.log(`::error::npm >= 11.5.1 is required for Trusted Publishing, found ${v}`);
              process.exit(1);
            }
          '

      # Repo-local config, so nothing leaks into the runner's global git config.
      - name: "Configure Git identity"
        run: |
          git config user.email webapp+travis@wire.com
          git config user.name "Wire Travis CI"

      # preversion builds & tests, postversion pushes and runs `npm publish` (OIDC, no token).
      - name: "Release new version"
        run: yarn version --minor

  run-ios-spm-tests:
    name: Test Swift package on macOS
    runs-on: macos-26

    steps:
      - name: Install swift-protobuf
        run: brew install swift-protobuf

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure generated code is up-to-date
        run: |
          set -Eeuo pipefail
          cd ios
          ./update.sh

          if [[ -n $(git status --porcelain) ]]; then
            echo "::error:: Working tree has uncommitted changes or untracked files:"
            echo "Run ./update.sh in the ios directory and commit the changes!"
            echo    # blank line for readability
            git status --porcelain
            exit 1             # any non-zero exit code fails the step → job
          fi

      - name: Run tests via swift test
        run: swift test

      - name: Run tests via xcodebuild
        run: |
          xcodebuild \
            -workspace . \
            -scheme GenericMessageProtocol \
            -destination "platform=macOS,arch=arm64" \
            -quiet \
            clean test
