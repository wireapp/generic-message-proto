name: Test, Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test_build_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit and tag on release
      id-token: write # npm Trusted Publishing (OIDC)

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Set up Node.js (for build/test and npm publish)"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Use the npm bundled with Node instead of downloading another version.
      - name: "Verify npm version (Trusted Publishers requires npm >= 11.5.1)"
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm >= 11.5.1 is required for Trusted Publishing, found $v"
            exit 1
          fi

      # Don't rely on a Yarn pre-installed on the runner: fetch the exact version from
      # package.json's "packageManager" field, verify its SHA-512 and install it into
      # the job's temp dir (nothing is installed globally on the runner).
      - name: "Install Yarn (version and checksum from packageManager)"
        run: |
          set -euo pipefail
          spec=$(node -p "require('./package.json').packageManager")
          [[ "$spec" =~ ^yarn@([0-9.]+)\+sha512\.([0-9a-f]{128})$ ]] || { echo "::error::Unexpected packageManager: $spec"; exit 1; }
          version="${BASH_REMATCH[1]}"; sha512="${BASH_REMATCH[2]}"
          dir="$RUNNER_TEMP/yarn"; mkdir -p "$dir"
          curl -fsSL -o "$dir/yarn.tgz" "https://registry.npmjs.org/yarn/-/yarn-$version.tgz"
          echo "$sha512  $dir/yarn.tgz" | sha512sum -c -
          tar -xzf "$dir/yarn.tgz" -C "$dir"
          echo "$dir/package/bin" >> "$GITHUB_PATH"

      - name: "Extend environment variables"
        run: |
          echo "BRANCH_NAME=$(git branch --show-current)" >> $GITHUB_ENV

      - name: "Build & Test"
        run: |
          echo "Using yarn $(yarn --version) from $(command -v yarn)"
          yarn --frozen-lockfile && yarn dist && yarn test

      # No npm token needed for publish; OIDC is handled automatically by npm Trusted Publishers
      - name: "Configure Git identity"
        if: env.BRANCH_NAME == 'master'
        run: |
          git config --global user.email webapp+travis@wire.com
          git config --global user.name "Wire Travis CI"

      - name: "Release new version"
        if: env.BRANCH_NAME == 'master'
        run: yarn version --minor

  run-ios-spm-tests:
    name: Test Swift package on macOS
    runs-on: macos-26

    steps:
      - name: Install swift-protobuf
        run: brew install swift-protobuf

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure generated code is up-to-date
        run: |
          set -Eeuo pipefail
          cd ios
          ./update.sh

          if [[ -n $(git status --porcelain) ]]; then
            echo "::error:: Working tree has uncommitted changes or untracked files:"
            echo "Run ./update.sh in the ios directory and commit the changes!"
            echo    # blank line for readability
            git status --porcelain
            exit 1             # any non-zero exit code fails the step → job
          fi

      - name: Run tests via swift test
        run: swift test

      - name: Run tests via xcodebuild
        run: |
          xcodebuild \
            -workspace . \
            -scheme GenericMessageProtocol \
            -destination "platform=macOS,arch=arm64" \
            -quiet \
            clean test
