name: Test, Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Runs for pull requests and pushes. Read-only: no write access, no OIDC token.
  test_build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up toolchain"
        uses: ./.github/actions/setup-toolchain

      - name: "Build & Test"
        run: |
          echo "Using yarn $(yarn --version) from $(command -v yarn)"
          yarn --frozen-lockfile && yarn dist && yarn test

      # Hand the generated code to the release job, so it publishes exactly this build
      # and never has to run dependency code itself.
      - name: "Upload generated package files"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-web
          path: |
            web/*.js
            web/*.d.ts
            !web/compile.js
          if-no-files-found: error
          retention-days: 1

  # Only runs for pushes to master, after all tests passed. It doesn't install or run any
  # dependency code: it publishes the files built by test_build.
  #
  # The "release" environment is meant to be restricted to master (GitHub repo settings)
  # and required by the npm Trusted Publisher config. Both are manual setup steps for an
  # admin; until they are done, the environment has no protection rules of its own.
  #
  # If a run fails after "Push release commit and tag" (e.g. npm publish fails), that
  # version exists on GitHub but not on npm, and re-running skips (master has moved).
  # Recovery: publish that version manually, or just let the next merge release.
  release:
    name: Release
    needs: [test_build, run-ios-spm-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push version commit and tag
      id-token: write # npm Trusted Publishing (OIDC)

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # credentials are kept: this job pushes the release commit and tag

      # Only release the exact commit that passed all tests. If master has moved on in the
      # meantime, the run for the newer commit releases instead, after its own tests passed.
      - name: "Check that this commit is still the tip of master"
        id: tip
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "::error::Could not determine the current master commit"
            exit 1
          fi
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping release: master moved from $GITHUB_SHA to $remote_sha"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Set up Node.js"
        if: steps.tip.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # Use the npm bundled with Node instead of downloading another version.
      - name: "Verify npm version (Trusted Publishers requires npm >= 11.5.1)"
        if: steps.tip.outputs.current == 'true'
        run: |
          node -e '
            const v = require("node:child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number), [x, y, z] = [11, 5, 1];
            console.log(`npm ${v}`);
            if (a < x || (a === x && (b < y || (b === y && c < z)))) {
              console.log(`::error::npm >= 11.5.1 is required for Trusted Publishing, found ${v}`);
              process.exit(1);
            }
          '

      - name: "Download generated package files"
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-web
          path: web

      # Repo-local config, so nothing leaks into the runner's global git config.
      - name: "Configure Git identity"
        if: steps.tip.outputs.current == 'true'
        run: |
          git config user.email webapp+travis@wire.com
          git config user.name "Wire Travis CI"

      - name: "Bump minor version (commit and tag)"
        if: steps.tip.outputs.current == 'true'
        run: npm version minor --ignore-scripts --message "v%s"

      # Atomic: the commit and tag are pushed together or not at all. If master moved
      # since the check above, the push is rejected and nothing gets published.
      - name: "Push release commit and tag"
        if: steps.tip.outputs.current == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          git push --atomic origin "HEAD:refs/heads/master" "refs/tags/v$version"

      # Authenticates via OIDC (npm Trusted Publishers), no token needed.
      - name: "Publish to npm"
        if: steps.tip.outputs.current == 'true'
        run: npm publish --ignore-scripts

  run-ios-spm-tests:
    name: Test Swift package on macOS
    runs-on: macos-26

    steps:
      - name: Install swift-protobuf
        run: brew install swift-protobuf

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure generated code is up-to-date
        run: |
          set -Eeuo pipefail
          cd ios
          ./update.sh

          if [[ -n $(git status --porcelain) ]]; then
            echo "::error:: Working tree has uncommitted changes or untracked files:"
            echo "Run ./update.sh in the ios directory and commit the changes!"
            echo    # blank line for readability
            git status --porcelain
            exit 1             # any non-zero exit code fails the step → job
          fi

      - name: Run tests via swift test
        run: swift test

      - name: Run tests via xcodebuild
        run: |
          xcodebuild \
            -workspace . \
            -scheme GenericMessageProtocol \
            -destination "platform=macOS,arch=arm64" \
            -quiet \
            clean test
