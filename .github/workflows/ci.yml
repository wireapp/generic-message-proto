name: Test, Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js for build and test"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: "Build & Test"
        run: yarn && yarn dist && yarn test

  release:
    name: Release package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - build-and-test
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Node.js for build"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: "Build and test release contents"
        run: yarn && yarn dist && yarn test

      - name: "Configure Git identity"
        run: |
          git config --global user.email webapp+travis@wire.com
          git config --global user.name "Wire Travis CI"

      - name: "Configure Node.js for GitHub Packages"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wireapp"

      - name: "Publish current version if missing from GitHub Packages"
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_REFERENCE="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          if npm view \
            "$PACKAGE_REFERENCE" \
            version \
            --registry=https://npm.pkg.github.com \
            >/dev/null 2>&1; then
            echo "📦 ${PACKAGE_REFERENCE} already exists in GitHub Packages."
            exit 0
          fi

          echo "📦 Publishing existing ${PACKAGE_REFERENCE} to GitHub Packages..."
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Release new version"
        run: yarn version --minor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-ios-spm-tests:
    name: Test Swift package on macOS
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Install swift-protobuf
        run: brew install swift-protobuf

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Ensure generated code is up-to-date
        run: |
          set -Eeuo pipefail
          cd ios
          ./update.sh

          if [[ -n $(git status --porcelain) ]]; then
            echo "::error:: Working tree has uncommitted changes or untracked files:"
            echo "Run ./update.sh in the ios directory and commit the changes!"
            echo    # blank line for readability
            git status --porcelain
            exit 1             # any non-zero exit code fails the step → job
          fi

      - name: Run tests via swift test
        run: swift test

      - name: Run tests via xcodebuild
        run: |
          xcodebuild \
            -workspace . \
            -scheme GenericMessageProtocol \
            -destination "platform=macOS,arch=arm64" \
            -quiet \
            clean test
